name: Test

on:
  push:
    branches:
      - master
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        with:
          chrome-version: '157'
          install-dependencies: true

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          EXCALIDRAW_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Build
        run: pnpm build

      - name: Pack tarball
        run: pnpm pack

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: excalidraw-tools-tgz
          path: '*.tgz'
          if-no-files-found: error