name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Keep the write token out of .git/config: dependency postinstall
          # scripts and test code run before the release step.
          persist-credentials: false

      - name: Validate version
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::version must look like v0.1.0"
            exit 1
          fi

          package_version="$(jq -r '.version' package.json)"
          if [ "$VERSION" != "v$package_version" ]; then
            echo "::error::input $VERSION does not match package.json version v$package_version"
            exit 1
          fi

      - name: Reject an existing tag or release
        run: |
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::tag $VERSION already exists; bump package.json and choose a new version"
            exit 1
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $VERSION already exists; bump package.json and choose a new version"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        with:
          chrome-version: '157'
          install-dependencies: true

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          EXCALIDRAW_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Build
        run: pnpm build

      - name: Pack tarball
        run: pnpm pack

      - name: Prepare release notes
        run: |
          note="docs/releases/${VERSION}.md"
          if [ -f "$note" ]; then
            cp "$note" release-notes.md
          else
            printf '# %s\n\n本版本没有单独的发布说明，变更见提交记录。\n' "$VERSION" > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.version }}
          body_path: release-notes.md
          files: '*.tgz'
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}