name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          EXCALIDRAW_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Build
        run: pnpm build

      - name: Pack tarball
        run: pnpm pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: reachforstar-excalidraw-tools-*.tgz
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
