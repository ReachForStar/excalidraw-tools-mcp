name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate version
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::version must look like v0.1.0"
            exit 1
          fi

          package_version="$(jq -r '.version' package.json)"
          if [ "$VERSION" != "v$package_version" ]; then
            echo "::error::input $VERSION does not match package.json version v$package_version"
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          EXCALIDRAW_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Build
        run: pnpm build

      - name: Pack tarball
        run: pnpm pack

      - name: Prepare release notes
        run: |
          note="docs/releases/${VERSION}.md"
          if [ -f "$note" ]; then
            cp "$note" release-notes.md
          else
            printf '# %s\n\n本版本没有单独的发布说明，变更见提交记录。\n' "$VERSION" > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.version }}
          body_path: release-notes.md
          files: reachforstar-excalidraw-tools-*.tgz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
