name: Bug 报告
description: 报告可复现的缺陷
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索现有 Issue，并确认使用的是最新版本。
        安全问题请通过 [私密漏洞报告](https://github.com/ReachForStar/excalidraw-tools-mcp/security/advisories/new) 提交，不要公开披露。
  - type: input
    id: version
    attributes:
      label: 版本
      description: '`excalidraw-mcp --version` 或 `package.json` 的版本'
      placeholder: v0.1.1
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 接入方式
      options:
        - MCP stdio
        - MCP Streamable HTTP
        - cordis 插件
        - 其他
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Node.js、pnpm 与 Chrome/Chromium 版本
      placeholder: Ubuntu 24.04 / Node 22 / Chrome 157
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 尽量给出最小复现场景，包含工具名与参数
      placeholder: |
        1. 启动 `excalidraw-mcp --workspace /tmp/ws`
        2. 调用 `excalidraw_draw`，参数 ...
        3. 观察到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与日志
      description: 服务端 stderr、客户端报错与返回内容
      render: text
    validations:
      required: true
